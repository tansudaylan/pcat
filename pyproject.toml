[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcat"
version = "0.1.0"
description = "Transdimensional probabilistic cataloging for astronomical inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
keywords = ["astronomy", "bayesian", "catalog", "mcmc", "transdimensional"]
dependencies = [
  "astropy",
  "chalcedon",
  "cloudpickle",
  "h5py",
  "matplotlib",
  "numba",
  "numpy",
  "Pillow",
  "scipy",
  "scikit-learn",
  "seaborn",
  "tdpy",
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.4"]
neural = ["torch>=2.2"]
docs = [
  "sphinx>=8",
  "sphinx-rtd-theme>=3",
]
examples = [
  "astroquery",
  "dynesty",
  "ephesos",
  "emcee",
]

[tool.setuptools]
packages = ["pcat"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_narration.py", "test_plotting.py"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
