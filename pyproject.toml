[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcat"
version = "0.1.0"
description = "Transdimensional probabilistic cataloging for astronomical inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
keywords = ["astronomy", "bayesian", "catalog", "mcmc", "transdimensional"]
dependencies = [
  "astropy",
  "cloudpickle",
  "h5py",
  "matplotlib",
  "numba",
  "numpy",
  "Pillow",
  "scipy",
  "seaborn",
  "tdpy",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8",
  "sphinx-rtd-theme>=3",
]
examples = [
  "dynesty",
  "emcee",
]

[tool.setuptools]
packages = ["pcat"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_narration.py", "test_plotting.py"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
